<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jayantha Sinha Filmmaker</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Poppins:wght@500;600&family=Playfair+Display:wght@400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--red:#ff3b3b;--ink:#000;--paper:#fff;--rose:#c0868b;--grey:#b9b9b9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);font-family:'Poppins',sans-serif}
header{position:relative;height:124px;display:flex;align-items:center;padding:0 24px 0 70px;background:var(--paper)}
.logo{position:absolute;left:70px;top:8px;font-family:'Playfair Display',serif;font-size:42px;letter-spacing:1px;line-height:1;color:#000;text-decoration:none;white-space:nowrap}
.logo i{position:absolute;left:100px;top:6px;font-family:'Mrs Saint Delafield',cursive;font-style:normal;font-size:96px;color:var(--red);line-height:1;pointer-events:none}
nav{margin-left:auto;display:flex;align-items:center;gap:0}
nav a{font-weight:600;font-size:25px;color:#000;text-decoration:none;width:210px;text-align:center;font-size:clamp(14px,1.35vw,25px)}
nav a:first-child{color:var(--red);width:170px;margin-right:-60px;text-align:left}
nav .soc{display:flex;gap:26px;margin-left:10px;margin-right:20px}
nav .soc svg{width:30px;height:30px;fill:#000}
main{position:relative;background:var(--ink);margin:0 20px 0 68px;min-height:calc(100vh - 124px);height:1504px;max-height:none;overflow:visible}
.side{position:fixed;left:0;top:156px;width:68px;height:660px;background:var(--red);z-index:5;display:flex;align-items:center;justify-content:center}
.side2{top:969px;height:660px}
.side span{transform:rotate(-90deg);color:#fff;font-weight:600;font-size:23px;white-space:nowrap}
.edge{position:absolute;right:-20px;width:20px;background:#fff}
.edge.a{top:0;height:140px}.edge.b{top:692px;height:260px}
.photo{position:absolute;left:733px;top:164px;width:896px;height:1194px;overflow:hidden;
 background:url(photo.jpg) center/cover,
 radial-gradient(ellipse at 20% 30%,#fff3d6 0,#f6c58b 25%,transparent 55%),
 linear-gradient(100deg,#f7d9a8 0%,#c4704a 45%,#6a2c22 75%,#3a1414 100%)}
.name{position:absolute;left:170px;top:610px;z-index:3;width:1000px}
.name h1,.name h2{font-family:'Jost',sans-serif;font-weight:200;line-height:1;letter-spacing:-2px}
.name h1{font-size:230px;color:var(--red);position:absolute;left:0;top:0;white-space:nowrap}
.name h2{font-size:200px;color:#fff;position:absolute;left:72px;top:150px;white-space:nowrap;clip-path:inset(0 calc(100% - 596px) 0 0)}
.name .script{position:absolute;left:0;top:232px;font-family:'Mrs Saint Delafield',cursive;font-size:118px;color:var(--red);line-height:1;opacity:.95}
.role{position:absolute;left:176px;top:1100px;font-family:'Jost',sans-serif;font-weight:300;font-size:37px;line-height:50px;letter-spacing:1px;color:var(--grey)}
.shape{position:absolute;z-index:2}
.s1{left:333px;top:226px;width:70px;height:52px;background:var(--red);clip-path:polygon(0 0,100% 0,78% 100%,15% 100%)}
.s2{left:806px;top:440px;width:62px;height:62px;background:var(--rose);clip-path:polygon(30% 0,100% 20%,95% 100%,0 80%)}
.s3{left:454px;top:1372px;width:70px;height:84px;background:var(--red);clip-path:polygon(0 0,100% 70%,85% 100%,40% 90%)}
.s4{left:1511px;top:276px;width:92px;height:56px;background:var(--grey);clip-path:polygon(40% 0,100% 20%,15% 100%,0 85%);z-index:4}
.s5{left:1590px;top:1350px;width:48px;height:56px;background:var(--rose);clip-path:polygon(60% 0,100% 40%,50% 100%,0 70%);z-index:4}
.chev{position:absolute;right:46px;width:62px;height:34px;z-index:4}
.chev.a{top:612px}.chev.b{top:1425px}
.chev path{fill:none;stroke:#fff;stroke-width:5}
.mini{position:absolute;left:1553px;top:735px;z-index:6;display:flex;gap:18px}
.mini svg{width:26px;height:26px;fill:#000}
@media(max-width:900px){
 header{height:auto;padding:12px;flex-wrap:wrap}.logo,.logo i{position:static}.logo i{display:none}
 nav{width:100%;flex-wrap:wrap;margin-top:8px}nav a{width:auto;padding:6px 10px;margin:0!important}
 .side{display:none}main{margin:0;height:auto;padding:24px 16px 48px}
 .photo,.name,.name h1,.name h2,.name .script,.role,.shape,.chev,.edge,.mini{position:static}
 .photo{width:100%;height:60vh;margin:24px 0}.name{width:auto}
 .name h1{font-size:22vw}.name h2{font-size:20vw;clip-path:none}.name .script{display:none}
 .role{font-size:24px;line-height:34px}.shape,.chev,.edge,.mini{display:none}
}
</style>
</head>
<body>
<header>
 <a class="logo" href="#">JAYANTHA<i>Sinha</i></a>
 <nav>

 </nav>
</header>

 <div class="name">
  <h1>Jayantha</h1>
  <h2>Sinha</h2>

 </div>
 <p class="role">Filmmaker<br>Director of Photography</p>

</main>
</body>
</html>
