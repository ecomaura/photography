<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jayantha Sinha Filmmaker</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Poppins:wght@500;600&family=Playfair+Display&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--red:#ff3b3b;--grey:#b9b9b9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#fff;color:#000}
header{display:flex;align-items:center;gap:32px;padding:14px 32px 14px 100px;min-height:96px}
.logo{position:relative;display:flex;align-items:baseline;gap:6px;text-decoration:none;color:#000;font-family:'Playfair Display',serif;font-size:36px;letter-spacing:1px;white-space:nowrap;flex:none}
.logo i{font-family:'Mrs Saint Delafield',cursive;font-style:normal;font-size:64px;color:var(--red);line-height:.6}
nav{flex:1;display:flex;justify-content:center;gap:clamp(16px,3vw,56px)}
nav a{font-weight:600;font-size:clamp(14px,1.2vw,19px);color:#000;text-decoration:none;white-space:nowrap}
nav a.on{color:var(--red)}
.soc{display:flex;gap:20px;flex:none}
.soc svg{width:24px;height:24px;fill:#000;display:block}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:48px;margin-left:68px;background:#000;min-height:calc(100vh - 96px);padding:64px 80px 64px 100px}
.strip{position:fixed;left:0;top:0;bottom:0;width:68px;background:var(--red);display:flex;align-items:center;justify-content:center;text-decoration:none;z-index:5}
.strip span{transform:rotate(-90deg);color:#fff;font-weight:600;font-size:22px}
.text h1{font-family:'Jost',sans-serif;font-weight:200;line-height:1;letter-spacing:-2px;font-size:clamp(64px,10vw,170px)}
.text h1 b{display:block;font-weight:200;color:var(--red)}
.text h1 span{display:block;color:#fff}
.role{margin-top:56px;font-family:'Jost',sans-serif;font-weight:300;font-size:clamp(20px,2vw,32px);line-height:1.4;letter-spacing:1px;color:var(--grey)}
.photo{aspect-ratio:3/4;width:100%;max-height:80vh;justify-self:end;
 background:url(photo.jpg) center/cover,radial-gradient(ellipse at 20% 30%,#fff3d6 0,#f6c58b 25%,transparent 55%),linear-gradient(100deg,#f7d9a8,#c4704a 45%,#6a2c22 75%,#3a1414)}
@media(max-width:900px){
 header{flex-wrap:wrap;padding:12px 16px 12px 84px;gap:8px 16px}
 nav{order:3;flex-basis:100%;flex-wrap:wrap;justify-content:flex-start;gap:8px 18px}
 .soc{margin-left:auto}
 .hero{grid-template-columns:1fr;padding:40px 20px 48px 24px}
 .photo{max-height:none}
}
</style>
</head>
<body>
<a class="strip" href="#showreel"><span>Showreel</span></a>
<header>
 <a class="logo" href="#">JAYANTHA<i>Sinha</i></a>
 <nav>
  <a class="on" href="#">Home</a><a href="#about">About</a><a href="#experience">Experience</a><a href="#showreel">Showreel</a><a href="#gallery">Video Gallery</a><a href="#mentions">Mentions</a><a href="#contact">Contact</a>
 </nav>
 <div class="soc">
  <svg viewBox="0 0 24 24" aria-label="Facebook"><path d="M14 8V6.300c0-.8.2-1.300 1.400-1.300H17V2h-2.600C11.400 2 10 3.700 10 6.100V8H7.500v3H10v11h4V11h2.800l.4-3z"/></svg>
  <svg viewBox="0 0 24 24" aria-label="Twitter"><path d="M22 5.900c-.7.300-1.500.500-2.300.600.800-.5 1.500-1.300 1.800-2.200-.8.500-1.600.8-2.600 1a4 4 0 0 0-6.900 3.700C8.800 8.800 5.800 7.200 3.800 4.800a4 4 0 0 0 1.200 5.400c-.7 0-1.300-.2-1.800-.5 0 2 1.400 3.600 3.200 4a4 4 0 0 1-1.800.1 4 4 0 0 0 3.800 2.800A8 8 0 0 1 2 18.200 11.400 11.400 0 0 0 8.100 20c7.500 0 11.700-6.300 11.400-12 .8-.6 1.800-1.200 2.500-2.100z"/></svg>
  <svg viewBox="0 0 24 24" aria-label="Instagram"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.500-3.200a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400z"/></svg>
  <svg viewBox="0 0 48 24" aria-label="IMDb" style="width:40px"><path d="M2 2h44v20H2zm2 2v16h40V4z"/><text x="24" y="16" font-size="10" font-weight="800" text-anchor="middle" font-family="Arial">IMDb</text></svg>
 </div>
</header>
<main class="hero">
 <div class="text">
  <h1><b>Jayantha</b><span>Sinha</span></h1>
  <p class="role">Filmmaker<br>Director of Photography</p>
 </div>
 <div class="photo" role="img" aria-label="Jayantha Sinha behind a cinema camera"></div>
</main>
</body>
</html>
